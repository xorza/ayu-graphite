# Ayu Graphite — palette (single source of truth)
#
# Three tables of inputs and one table of roles. grid.py derives every
# primitive from the inputs when the file is loaded, so no hex value below
# the roles table is written by hand.
#
#   [base]      five colors. Only the hue of each survives.
#   [tints]     a perceived brightness per row of the grid.
#   [neutrals]  the grey ladder, as Oklab lightness.
#   [semantic]  roles, each naming a primitive: `red_bright`, `gray_3`.
#
# THE GRID. Five hues by three tints, complete. A hue is one fixed Oklab
# angle, the angle of its base color. A tint is one fixed PERCEIVED brightness
# that every hue shares, so `red_bright` and `blue_bright` look equally bright,
# and one chroma the hues share, so they look equally saturated too. Any two
# names that end in the same tint sit level with each other both ways.
#
# Perceived, not measured. At one luminance a saturated color looks brighter
# than a dull one — the Helmholtz-Kohlrausch effect — so an equal-luminance
# row reads uneven: it put red at 65 and yellow at 55 on a scale where the
# whole row measured CIE L* 49.5. Each cell is placed by Fairchild-Pirrotta
# corrected lightness L** instead, which folds chroma into the prediction.
#
# Saturated, and level. sRGB is lopsided: red and blue hold chroma when dark,
# yellow and green when light. A row of gamut maxima reads uneven whatever
# the model says — at a mid brightness red holds half again the chroma of
# yellow, and the eye takes the surplus for brightness. So each row takes the
# ceiling of its most constrained hue: every hue keeps its own ceiling up to
# a line 1.5 points of Oklab chroma above the row's lowest, which is under
# the eye's threshold, and a hue over that line is cut to it. Red sets
# `bright`, where a light red is a pink, and yellow sets `normal` and `dim`,
# where a dark yellow is an olive. The base hues are the angles that leave
# each row the most: see [base].
#
#   tint      L**    what lands there
#   bright    75.4   ANSI 9-14, accent, status, every syntax ink
#   normal    56.4   ANSI 1-6, status borders, diff word fills, pressed
#   dim       33.5   ANSI dim (SGR 2), status fills, selection
#
# What pins each row is a rule tools/audit.py checks, and its report prints
# the live figures:
#
#   bright          an INK role clears 4.5:1 on `surface` and over a
#                   selection on `dim`. Blue sits on that floor. Higher, and
#                   red loses chroma: the row sits where red's ceiling meets
#                   yellow's.
#   normal          the ANSI band: a slot clears 3:1 as ink on `bg` and
#                   `text` clears 3:1 on it as a fill. Red and green also
#                   stay at or under luminance 0.183, where near-white ink
#                   clears 4.5:1 on a diff word fill, and that cap holds the
#                   row from above.
#   dim             at or under 0.044 so `text_muted` clears 4.5:1 on a
#                   selection, at or over 0.030 so the fill separates from
#                   the editor ground.
#
# Every one of the fifteen cells carries a semantic role.
#
# Invariants (tools/audit.py checks all six):
#   - chrome layers that stack in one view must differ: bg < panel < elem <
#     elem_hover < elem_active, and border must be visible on panel and elem.
#   - every bright fill (accent, success, warning, error) is written on with
#     on_accent, never with text — text on accent is 1.28:1.
#   - per hue, ANSI dim < normal < bright, and no two of the 16 share a value,
#     the cyan row aside: it is the blue row again, and is held equal to it.
#   - the ANSI rows split the two duties one slot cannot hold at once. See the
#     [semantic] ANSI block.
#   - every cell of a tint row looks equally bright, within 1.5 points of L**.
#   - every cell of a tint row is equally saturated, within the 1.5 points of
#     Oklab chroma the grid allows plus rounding. The grid solves for both,
#     and the checks catch a solver that drifts or a rounding that lands a
#     cell off its row.

[base]
# One hue each. The lightness and chroma of a base color are discarded: every
# cell of its column is solved from the row it sits on. The angles are where
# sRGB leaves a level row the most. Red at 30°, a true red: lower is crimson
# and gains nothing, higher is orange. Orange at 60°, its peak on `bright`.
# Yellow at 95°, where its ceiling is flat and the darker rows already bow to
# it. Green at 140°, its peak. Blue at 242°, its peak on `bright`: past 250°
# it is violet and weak there. Three warm hues about 32° apart carry the
# theme, and two cool ones stand off them, every neighbour 30° or more away.
red    = "#ff8a78"
orange = "#f78b00"
yellow = "#ccab00"
green  = "#38b700"
blue   = "#07abff"

[tints]
# Fairchild-Pirrotta L**. The header says what pins each one. Raise `bright`
# and the row steps toward white, red first.
bright = 75.4
normal = 56.4
dim    = 33.5

[neutrals]
# Oklab lightness. Saturation zero — every channel equal, no hue at all — so
# a rung's luminance is its lightness cubed. Seven greys is the floor, not a
# preference. Five go to chrome: bg, panel, surface, hover and press are
# checked against each other pairwise, so none may repeat, and they climb
# evenly from `floor` by `step`. The step has to clear 1.10:1 between rungs,
# and the top rung has to hold `text` at 4.5:1, which bounds it at 0.07. The
# other two are the whole text hierarchy, one dim and one bright. The dim one
# sits at 0.72 because below 0.71 `text_muted` stops clearing 4.5:1 on a
# surface. A sixth grey would have to come out of that pair, which leaves
# muted text and body text the same color, and the ANSI white family needs
# all three of dim, normal and bright to differ.
floor      = 0.24
step       = 0.05
text_muted = 0.72
text       = 0.94

[semantic]

# Backgrounds / chrome. Each step must be distinguishable from the one under
# it — a control that shares its fill with the panel it sits on disappears.
bg                  = "gray_1"             # deepest: editor, list/view interiors
panel               = "gray_2"             # window, sidebar, menu, tab bar
surface             = "gray_3"             # elevated: popup, tooltip, dialog
elem                = "gray_3"             # control resting fill
elem_hover          = "gray_4"
elem_active         = "gray_5"
elem_disabled       = "gray_2"             # recessed below resting, not equal to it
title_bar           = "gray_3"
title_bar_inactive  = "gray_2"
overlay_black       = "black"

# Borders
border              = "gray_4"
border_focused      = "blue_normal"

# Text
text                = "gray_7"
text_muted          = "gray_6"
text_disabled       = "gray_6"

# Accent / status. Every one of these is an INK role, so all of them sit on
# `bright`, the one tint that clears 4.5:1 on `surface`. Blue is the one cool
# hue, so it carries the accent and the hint family both. There is no tint
# above `bright` for a hover to lift into, so the hover is the accent again,
# and a press drops to `normal`.
accent              = "blue_bright"
accent_hover        = "blue_bright"
accent_active       = "blue_normal"
success             = "green_bright"
warning             = "yellow_bright"
error               = "red_bright"
hint                = "blue_bright"

# Ink for anything drawn on a bright fill — accent buttons, unread badges,
# success/warning/error chips. `text` on `accent` is 1.28:1.
on_accent           = "black"
on_accent_muted     = "blue_dim"

# Selection (list row, selected message, selected text). On `dim`, the one
# tint dark enough for `accent` to stay legible on top of it.
selection_bg        = "blue_dim"
selection_fg        = "gray_7"

# Status fills take `dim`, their borders `normal`.
info_bg             = "blue_dim"
info_border         = "blue_normal"
hint_bg             = "blue_dim"
hint_border         = "blue_normal"
success_bg          = "green_dim"
success_border      = "green_normal"
warning_bg          = "yellow_dim"
warning_border      = "yellow_normal"
error_bg            = "red_dim"
error_border        = "red_normal"
diagnostic_muted_bg = "gray_5"

# Diff (terminal-pane variants — louder than line-bg diffs)
diff_term_plus      = "green_bright"
diff_term_minus     = "red_bright"

# Word-level diff fills. These are BACKGROUNDS — Claude Code paints the
# changed word of a line with them and draws its own near-white syntax ink on
# top. That ink clears 4.5:1 only on a fill at or under luminance 0.183, and
# holding red and green there is what pins the `normal` row from above.
diff_word_plus      = "green_normal"
diff_word_minus     = "red_normal"

# Editor chrome
line_number         = "gray_5"
line_number_active  = "gray_7"
line_number_hover   = "gray_7"
scrollbar_thumb     = "gray_6"
drop_target         = "gray_6"
search_highlight    = "blue_bright"
search_match_active = "orange_bright"

# ANSI 16 + the dim (SGR 2) siblings. Every terminal target reads exactly
# these — bright is lighter than normal, dim is darker, per hue. Black is the
# one family where "normal" is already the floor, so dim goes to pure black.
#
# A program picks any slot as a foreground (SGR 30-37, 90-97) or as a
# background (SGR 40-47, 100-107) and the theme cannot tell which. On this bg
# no color clears 4.5:1 in both roles: a foreground needs luminance >= 0.237,
# a background under `text` needs <= 0.144. So the rows divide the work.
#
#   normal 1-6   3:1 or better both ways — as ink on bg, and under `text`
#                when a program fills with it. This is the row that stops
#                the bright-on-bright case, and it costs the loud ayu hues:
#                at this luminance yellow is dark gold and green is olive.
#   bright 1-6   about 7:1 as ink, foreground-first. As a fill it needs dark
#                ink, which no palette can fix.
#   dim 1-6      about 1.5:1, which is what SGR 2 asks for. `dim` is pinned
#                by the selection rule, so faint here is the price of a
#                selection the accent stays legible on.
#
# Five hues fill six chromatic slots. Orange has no slot of its own and takes
# magenta's. Cyan's is the blue row again: no other cell is both a hue and
# distinct, and tools/audit.py holds the two rows equal so a half-edit cannot
# split them.
ansi_black          = "gray_1"
ansi_red            = "red_normal"
ansi_green          = "green_normal"
ansi_yellow         = "yellow_normal"
ansi_blue           = "blue_normal"
ansi_magenta        = "orange_normal"
ansi_cyan           = "blue_normal"
ansi_white          = "gray_7"

ansi_bright_black   = "gray_5"
ansi_bright_red     = "red_bright"
ansi_bright_green   = "green_bright"
ansi_bright_yellow  = "yellow_bright"
ansi_bright_blue    = "blue_bright"
ansi_bright_magenta = "orange_bright"
ansi_bright_cyan    = "blue_bright"
ansi_bright_white   = "white"

ansi_dim_black      = "black"
ansi_dim_red        = "red_dim"
ansi_dim_green      = "green_dim"
ansi_dim_yellow     = "yellow_dim"
ansi_dim_blue       = "blue_dim"
ansi_dim_magenta    = "orange_dim"
ansi_dim_cyan       = "blue_dim"
ansi_dim_white      = "gray_6"

# Players (collab cursor bg)
player_bg           = "gray_6"

# Chat
chat_check          = "green_bright"
chat_msg_bg         = "gray_3"

# Syntax. Five inks read on the editor ground, one per hue, so every token
# family shares a hue with its neighbours: red is the number, where a purple
# would stand, orange the keyword and the operator, yellow the function,
# green the string and its regex, blue the type and the attribute.
syn_keyword         = "orange_bright"
syn_function        = "yellow_bright"
syn_string          = "green_bright"
syn_string_regex    = "green_bright"
syn_comment         = "gray_6"
syn_number          = "red_bright"
syn_type            = "blue_bright"
syn_operator        = "orange_bright"
syn_attribute       = "blue_bright"
syn_punctuation     = "gray_7"
syn_doc             = "gray_6"
syn_string_special  = "orange_bright"
syn_predictive      = "blue_normal"
