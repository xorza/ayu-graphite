# Ayu Graphite — palette (single source of truth)
#
# Six tables of inputs and one table of roles. grid.py derives every
# primitive from the inputs when the file is loaded, so no hex value below
# the roles table is written by hand.
#
#   [base]      seven colors. Only the hue of each survives.
#   [hues]      which hues only a terminal draws.
#   [tints]     the perceived brightness of `dim`, the one row that is set.
#   [neutrals]  the grey ladder, as Oklab lightness.
#   [ink]       the grounds ink is written on, which `bright` is solved from.
#   [ansi]      the floor ANSI 1-6 clear as text, which `light` is solved from.
#   [selection] the inks a selection carries, which its fill is solved from.
#   [semantic]  roles, each naming a primitive: `red_bright`, `gray_3`.
#
# THE GRID. Seven hues by four tints, complete. A hue is one fixed Oklab
# angle, the angle of its base color. A tint is one fixed PERCEIVED brightness
# that every hue shares, so `red_normal` and `blue_normal` look equally
# bright, and one chroma the hues share, so they look equally saturated too.
# Any two names that end in `light`, `normal` or `dim` sit level with each
# other both ways. The syntax hues' `bright` cells are the inks: level in chroma, each at
# its own brightness. See "the inks" below.
#
# Perceived, not measured. At one luminance a saturated color looks brighter
# than a dull one — the Helmholtz-Kohlrausch effect — so an equal-luminance
# row reads uneven: it put red at 65 and yellow at 55 on a scale where the
# whole row measured CIE L* 49.5. Each cell is placed by Fairchild-Pirrotta
# corrected lightness L** instead, which folds chroma into the prediction.
#
# Saturated, and level. sRGB is lopsided: red and blue hold chroma when dark,
# yellow and green when light. L** already counts chroma as brightness, so a
# row of gamut maxima would be level in brightness, but not in saturation: at
# the bright row green holds close to half again what red does, and a hue that
# much more saturated than its neighbours stands out of the row on its own. So
# each row takes the ceiling of its most constrained hue: every hue keeps its
# own ceiling up to a line 1.5 points of Oklab chroma above the row's lowest,
# which is under the eye's threshold, and a hue over that line is cut to it.
# Red sets `bright`, where a light red is a pink, and the darker rows bow to
# the hue that holds least there. Cyan holds less than any, but it is a
# terminal hue and sets no line: see [hues]. See [base] for the angles.
#
#   tint      L**    what lands there
#   bright    solved terminal hues' ANSI 9-14, and the anchor for `normal`
#   (inks)    each   ANSI 9-14, accent, status, every syntax ink
#   light     solved ANSI 1-6
#   normal    midway status borders, diff word fills, pressed
#   dim       42.2   ANSI dim (SGR 2), status fills
#
# What pins each row is a rule tools/audit.py checks, and its report prints
# the live figures:
#
#   bright          solved, not set. A row's chroma peaks at one brightness
#                   and falls on either side of it, red first above it,
#                   because a light red is a pink. The row takes the peak,
#                   or the lowest brightness where every cell clears 4.5:1 on
#                   each [ink] ground when the peak sits under that floor.
#                   Today the floor wins, near 74.8, just above the peak.
#                   It is where the inks would sit if they sat level.
#   light           solved, not set: the lowest brightness where every
#                   cell clears the [ansi] floor as text on its ground.
#                   Purple sets it: purple reads brighter than its
#                   luminance, so on a level row it has the least contrast.
#                   It must also sit 3 points under every bright cell, so
#                   that normal and bright ANSI stay two colors. Today it
#                   lands near 71.3, 3.4 under purple's bright cell.
#   normal          midway between `dim` and `bright`, so the three rows
#                   climb in two equal steps. Red and green stay at or under
#                   luminance 0.183, where near-white ink clears 4.5:1 on a
#                   diff word fill.
#   dim             from about 42.45 up, the midpoint lifts green past the
#                   diff word cap. No rule holds it from below. It stays at
#                   42.2, because a lower `dim` makes the status fills and
#                   their borders darker for no gain, and the cap leaves no
#                   room for rounding.
#
# The inks. Each syntax hue's ink takes the bright row's rule alone: the most
# chroma at or above the lowest brightness where it clears 4.5:1 on each
# [ink] ground. A hue that holds the line 1.5 points above the weakest ink's
# best over a band of brightness sits in its middle. Red, orange and blue
# never reach that line and sit at their best: red on its floor, since a
# lighter red is a pink, orange and blue at their peaks. Green and yellow
# hold it high: a darker yellow is not a dimmer yellow but a gold and then an
# olive, so the band is what keeps yellow yellow. Then the APCA floor in
# [ink] lifts red, orange and blue, which sit darkest, and the line drops to
# what the weakest holds there, so every ink pays the same chroma. The inks
# stay level in chroma and spread in brightness, yellow highest.
#
# Twenty-three of the twenty-eight cells carry a semantic role. Orange's
# light, normal and dim, and the normal cells of the two terminal hues, stay
# defined: the grid is complete, and a role can name them.
#
# Invariants (tools/audit.py checks all six):
#   - chrome layers that stack in one view must differ: bg < panel < elem <
#     elem_hover < elem_active, and border must be visible on panel and elem.
#   - every bright fill (accent, success, warning, error) is written on with
#     on_accent, never with text — text on accent is 1.28:1.
#   - per hue, ANSI dim < normal < bright, normal 3 points of L** under
#     bright, and no two of the 16 share a value.
#   - ANSI 1-6 read as text: normal clears the [ansi] floor, bright 4.5:1.
#     See the [semantic] ANSI block.
#   - every cell of a tint row looks equally bright, within 1.5 points of L**.
#     The inks are not a row and sit apart: only the chroma check holds them.
#   - every cell of a tint row is equally saturated, within the 1.5 points of
#     Oklab chroma the grid allows plus rounding. The grid solves for both,
#     and the checks catch a solver that drifts or a rounding that lands a
#     cell off its row.

[base]
# One hue each. The lightness and chroma of a base color are discarded: every
# cell of its column is solved from the row it sits on.
#
# Red at 20°: sRGB's own red is at 29°, but at an ink's brightness that is a
# coral that reads as orange beside orange, and 20° turns it toward crimson,
# as Ayu's red does. Orange at 60°, its peak on `bright`. Yellow at 100°: its
# ink sits high (see the inks), and a high yellow grows paler the nearer it
# turns to green, so 105° is a lemon, 90° a warmer gold, and 100° the yellow
# between. On the darker rows it is olive. The three warm hues stand 40°
# apart. Green at 140°, its peak. Blue at 242°, its peak on `bright`: past
# 250° it is violet and weak there.
#
# Cyan and purple exist so every ANSI slot has a hue of its own, so they sit
# where they are told apart best: each at the middle of the gap it fills.
# Cyan at 190.9°, 51° from green and from blue. Purple at 310.9°, 69° from
# blue and from red. Cyan is the weakest hue in sRGB at every brightness,
# lowest near 200°. As a terminal hue it sets no line, so that costs cyan
# alone.
red    = "#c50032"
orange = "#f78b00"
yellow = "#9b8900"
green  = "#38b700"
cyan   = "#00e8e1"
blue   = "#07abff"
purple = "#be41ff"

[hues]
# A `terminal` hue is drawn only by programs in a terminal, never in code. It
# sits on each row's brightness, `bright` included, under that row's chroma
# line, and sets no line: cyan holds the least chroma of any hue, and would
# cut every syntax ink down to it. Every other hue is a syntax hue, and its
# `bright` cell is an ink.
terminal = ["cyan", "purple"]

[tints]
# Fairchild-Pirrotta L**. The header says what pins it. There is no `bright`:
# a set value drifts off the row's best point, and above it every step toward
# white costs the whole row chroma. There is no `normal`: it is the midpoint.
# There is no `light`: [ansi] solves it.
dim = 42.2

[ink]
# Every chrome ground an INK role is written on. The bright row is solved to
# clear 4.5:1 on each. A role named here must not sit on the bright, light or
# normal row, which are solved from it. The selection is not here: it is
# solved from the inks instead, the other way round.
on = ["bg", "panel", "surface", "elem", "title_bar", "chat_msg_bg"]

# The inks also clear APCA Lc `apca` on `apca_on`, the editor ground code is
# read on. 4.5:1 alone leaves red, orange and blue at their most saturated,
# which in sRGB is darker than green and yellow can be and stay themselves:
# the floor lifts those three, and every ink pays the same chroma for it.
apca    = 56
apca_on = "bg"

[ansi]
# ANSI 1-6 are the row a terminal draws most text in: prompts, `ls`, `git`,
# compiler output. The `light` row is solved so that every cell clears APCA
# Lc `apca` as text on `apca_on`. Ayu's own dark theme gives its weakest
# normal slot 45, but a level row that clears 45 sits on the bright row and
# merges the two. 40 is the most it holds and still sits 3 points of L**
# under every bright cell: purple sets the floor, and red, green, yellow,
# blue and cyan land at 44 to 49. Before this row, ANSI 1-6 sat at 23 to 31.
apca    = 40
apca_on = "bg"

[selection]
# The fill under a selection, solved rather than taken from a row: the
# lightest `hue` fill on which every role in `ink` clears 4.5:1, at the most
# chroma the hue holds there. Lighter reads more clearly as a selection, so
# the fill stops where the weakest ink meets the floor. Taken from `dim`, it
# would tie that row to every ink, and through the midpoint, `normal` too.
hue = "blue"
ink = ["text", "text_muted", "selection_fg", "accent", "success", "warning",
       "ansi_bright_red"]

[neutrals]
# Oklab lightness. Saturation zero — every channel equal, no hue at all — so
# a rung's luminance is its lightness cubed. Seven greys is the floor, not a
# preference. Five go to chrome: bg, panel, surface, hover and press are
# checked against each other pairwise, so none may repeat, and they climb
# evenly from `floor` by `step`. The step has to clear 1.10:1 between rungs,
# and the top rung has to hold `text` at 4.5:1, which bounds it at 0.07. The
# other two are the whole text hierarchy, one dim and one bright. The dim one
# sits at 0.72 because below 0.71 `text_muted` stops clearing 4.5:1 on a
# surface. A sixth grey would have to come out of that pair, which leaves
# muted text and body text the same color, and the ANSI white family needs
# all three of dim, normal and bright to differ.
floor      = 0.24
step       = 0.05
text_muted = 0.72
text       = 0.94

[semantic]

# Backgrounds / chrome. Each step must be distinguishable from the one under
# it — a control that shares its fill with the panel it sits on disappears.
bg                  = "gray_1"             # deepest: editor, list/view interiors
panel               = "gray_2"             # window, sidebar, menu, tab bar
surface             = "gray_3"             # elevated: popup, tooltip, dialog
elem                = "gray_3"             # control resting fill
elem_hover          = "gray_4"
elem_active         = "gray_5"
elem_disabled       = "gray_2"             # recessed below resting, not equal to it
title_bar           = "gray_3"
title_bar_inactive  = "gray_2"
overlay_black       = "black"

# Borders
border              = "gray_4"
border_focused      = "blue_normal"

# Text
text                = "gray_7"
text_muted          = "gray_6"
text_disabled       = "gray_6"

# Accent / status. Every one of these is an INK role, so all of them are inks,
# which clear 4.5:1 on `surface`. Blue carries the accent and the hint family
# both. There is no tint above an ink for a hover to rise into, so the hover
# is the accent again, and a press drops to `normal`.
accent              = "blue_bright"
accent_hover        = "blue_bright"
accent_active       = "blue_normal"
success             = "green_bright"
warning             = "yellow_bright"
error               = "red_bright"
hint                = "blue_bright"

# Ink for anything drawn on a bright fill — accent buttons, unread badges,
# success/warning/error chips. `text` on `accent` is 1.28:1.
on_accent           = "black"
on_accent_muted     = "blue_dim"

# Selection (list row, selected message, selected text). The one fill off the
# grid: see [selection].
selection_bg        = "selection"
selection_fg        = "gray_7"

# Status fills take `dim`, their borders `normal`.
info_bg             = "blue_dim"
info_border         = "blue_normal"
hint_bg             = "blue_dim"
hint_border         = "blue_normal"
success_bg          = "green_dim"
success_border      = "green_normal"
warning_bg          = "yellow_dim"
warning_border      = "yellow_normal"
error_bg            = "red_dim"
error_border        = "red_normal"
diagnostic_muted_bg = "gray_5"

# Diff (terminal-pane variants — louder than line-bg diffs)
diff_term_plus      = "green_bright"
diff_term_minus     = "red_bright"

# Word-level diff fills. These are BACKGROUNDS — Claude Code paints the
# changed word of a line with them and draws its own near-white syntax ink on
# top. That ink clears 4.5:1 only on a fill at or under luminance 0.183, and
# holding red and green there is what pins the `normal` row from above.
diff_word_plus      = "green_normal"
diff_word_minus     = "red_normal"

# Editor chrome
line_number         = "gray_5"
line_number_active  = "gray_7"
line_number_hover   = "gray_7"
scrollbar_thumb     = "gray_6"
drop_target         = "gray_6"
search_highlight    = "blue_bright"
search_match_active = "orange_bright"

# ANSI 16 + the dim (SGR 2) siblings. Every terminal target reads exactly
# these — bright is lighter than normal, dim is darker, per hue. Black is the
# one family where "normal" is already the floor, so dim goes to pure black.
#
# A program picks any slot as a foreground (SGR 30-37, 90-97) or as a
# background (SGR 40-47, 100-107) and the theme cannot tell which. On this bg
# no color clears 4.5:1 in both roles: a foreground needs luminance >= 0.237,
# a background under `text` needs <= 0.144. Programs draw far more text in
# these slots than fills, and a program that fills with one mostly writes
# black on it, as tmux, `ls` and powerline prompts do. So every row is text
# first, as in the common dark themes.
#
#   normal 1-6   the `light` row: Lc 40 or better as ink on bg, and the same
#                WCAG ratio under black, which is bg. Under `text` a fill
#                falls to about 2.2:1.
#   bright 1-6   about 7:1 as ink. As a fill it needs dark ink too.
#   dim 1-6      faint, which is what SGR 2 asks for.
#
# Six hues fill the six chromatic slots, purple in magenta's. Orange has no
# slot: it is the syntax keyword's hue.
ansi_black          = "gray_1"
ansi_red            = "red_light"
ansi_green          = "green_light"
ansi_yellow         = "yellow_light"
ansi_blue           = "blue_light"
ansi_magenta        = "purple_light"
ansi_cyan           = "cyan_light"
ansi_white          = "gray_7"

ansi_bright_black   = "gray_5"
ansi_bright_red     = "red_bright"
ansi_bright_green   = "green_bright"
ansi_bright_yellow  = "yellow_bright"
ansi_bright_blue    = "blue_bright"
ansi_bright_magenta = "purple_bright"
ansi_bright_cyan    = "cyan_bright"
ansi_bright_white   = "white"

ansi_dim_black      = "black"
ansi_dim_red        = "red_dim"
ansi_dim_green      = "green_dim"
ansi_dim_yellow     = "yellow_dim"
ansi_dim_blue       = "blue_dim"
ansi_dim_magenta    = "purple_dim"
ansi_dim_cyan       = "cyan_dim"
ansi_dim_white      = "gray_6"

# Players (collab cursor bg)
player_bg           = "gray_6"

# Chat
chat_check          = "green_bright"
chat_msg_bg         = "gray_3"

# Syntax. Five inks read on the editor ground, one per warm hue and two cool
# ones, so every token family shares a hue with its neighbours: red is the
# number, orange the keyword and the operator, yellow the function, green the
# string and its regex, blue the type and the attribute. Cyan and purple are
# the terminal's, and stay out of code.
syn_keyword         = "orange_bright"
syn_function        = "yellow_bright"
syn_string          = "green_bright"
syn_string_regex    = "green_bright"
syn_comment         = "gray_6"
syn_number          = "red_bright"
syn_type            = "blue_bright"
syn_operator        = "orange_bright"
syn_attribute       = "blue_bright"
syn_punctuation     = "gray_7"
syn_doc             = "gray_6"
syn_string_special  = "orange_bright"
syn_predictive      = "blue_normal"
