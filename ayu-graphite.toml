# Ayu Graphite — semantic palette (single source of truth)
#
# Two-tier:
#   [primitives] are the actual hex values, named by hue + brightness step.
#   [semantic]   keys reference primitives by name; that's what builders read.
#
# palette.py resolves the refs at load time. To shift a hue everywhere it's
# used, edit one primitive — semantic intent stays put.
#
# Two invariants worth keeping (tools/audit.py checks both):
#   - chrome layers that stack in one view must differ: bg < panel < elem <
#     elem_hover < elem_active, and border must be visible on panel and elem.
#   - every bright fill (accent, success, warning, error) is written on with
#     on_accent, never with text — text on accent is 1.28:1.
#   - the ANSI rows split the two duties a slot cannot hold at once. See the
#     [semantic] ANSI block for the arithmetic.

[primitives]
# Neutrals (warm-tinted greys, dark → light). Steps are spaced ~1.15:1 so
# three chrome layers plus a border stack with room to tell them apart; the
# old ramp packed bg/panel/elem into 1.09 total and they collapsed.
black     = "#000000"
gray_950  = "#1f1e1d"
gray_900  = "#282726"
gray_850  = "#323130"
gray_800  = "#3d3c3b"
gray_750  = "#484745"
gray_600  = "#70747a"
gray_500  = "#878a8d"
gray_400  = "#aaaaa8"
gray_300  = "#c7c6bf"
gray_200  = "#e2dfd3"
gray_100  = "#f6f6f6"
white     = "#ffffff"

# Reds
red_250   = "#ffa493"     # ansi bright red
red_400   = "#ff6b52"     # error / deleted
red_450   = "#dc4b34"     # ansi red
red_550   = "#c83620"     # diff word minus
red_600   = "#a81a01"     # ansi dim red
red_700   = "#703130"     # error border
red_900   = "#4f191a"     # error bg

# Oranges
orange_400 = "#ffa63d"    # keyword / operator
orange_500 = "#ff7d2d"    # search match active

# Yellows
yellow_300 = "#ffdd8c"    # string special
yellow_350 = "#e6db74"    # soft Monokai yellow — chat checkmarks
yellow_400 = "#ffd44a"    # warning / function
yellow_450 = "#e1b71e"    # ansi bright yellow
yellow_600 = "#987a01"    # ansi yellow
yellow_700 = "#81632b"    # warning border
yellow_800 = "#685202"    # ansi dim yellow
yellow_900 = "#5f4617"    # warning bg

# Greens (lime → olive)
lime_400  = "#daff58"     # success / string
green_400 = "#a8c90a"     # ansi bright green
green_700 = "#668a2f"     # success border
green_750 = "#6f8605"     # ansi green
green_800 = "#537624"     # diff word plus
green_900 = "#486a15"     # success bg
green_950 = "#4b5b01"     # ansi dim green

# Teals (cyan-green)
teal_400  = "#69ffd1"     # regex

# Cyan / blue
cyan_400  = "#7adcf3"     # type / attribute / search highlight
cyan_450  = "#7fdfff"     # accent hover
cyan_500  = "#59d4ff"     # accent
cyan_525  = "#7ec6d8"     # ansi bright cyan
cyan_550  = "#3fbde8"     # accent pressed / ripple
cyan_650  = "#3e8797"     # ansi cyan
cyan_800  = "#055d6d"     # ansi dim cyan
cyan_900  = "#14556b"     # secondary ink on an accent fill
blue_300  = "#93c1e1"     # ansi bright blue
blue_550  = "#5682a0"     # ansi blue
blue_600  = "#4a8ab0"     # info border
blue_675  = "#2e5975"     # ansi dim blue
blue_700  = "#2c4a60"     # info bg
blue_750  = "#123a5c"     # selection bg
blue_800  = "#105577"     # border focused / hint border
blue_900  = "#0f3e58"     # hint bg
blue_predict = "#7091b3"  # syn_predictive
blue_hint = "#77adbc"     # hint fg

# Purples
purple_350 = "#dda6ff"    # ansi bright magenta
purple_400 = "#d897ff"    # number
purple_550 = "#a262c6"    # ansi magenta
purple_750 = "#773898"    # ansi dim magenta

# One-off cool gray
slate_700 = "#4c515a"     # diagnostic muted bg

# ─────────────────────────────────────────────────────────────────────────

[semantic]
# Backgrounds / chrome. Each step must be distinguishable from the one under
# it — a control that shares its fill with the panel it sits on disappears.
bg                  = "gray_950"   # deepest: editor, list/view interiors
panel               = "gray_900"   # window, sidebar, menu, tab bar
surface             = "gray_850"   # elevated: popup, tooltip, dialog
elem                = "gray_850"   # control resting fill
elem_hover          = "gray_800"
elem_active         = "gray_750"
elem_disabled       = "gray_900"   # recessed below resting, not equal to it
title_bar           = "gray_850"
title_bar_inactive  = "gray_900"
overlay_black       = "black"

# Borders
border              = "gray_800"
border_focused      = "blue_800"

# Text
text                = "gray_200"
text_muted          = "gray_400"
text_disabled       = "gray_500"

# Accent / status
accent              = "cyan_500"
accent_hover        = "cyan_450"
accent_active       = "cyan_550"
success             = "lime_400"
warning             = "yellow_400"
error               = "red_400"
hint                = "blue_hint"

# Ink for anything drawn on a bright fill — accent buttons, unread badges,
# success/warning/error chips. `text` on `accent` is 1.28:1; this is 9.7:1.
on_accent           = "gray_950"
on_accent_muted     = "cyan_900"

# Selection (list row, selected message, selected text). Dark-tinted so the
# semantic foregrounds stay legible inside a selection, and so Zed / KDE /
# Telegram all highlight the same way.
selection_bg        = "blue_750"
selection_fg        = "gray_200"

# Status backgrounds
info_bg             = "blue_700"
info_border         = "blue_600"
hint_bg             = "blue_900"
hint_border         = "blue_800"
success_bg          = "green_900"
success_border      = "green_700"
warning_bg          = "yellow_900"
warning_border      = "yellow_700"
error_bg            = "red_900"
error_border        = "red_700"
diagnostic_muted_bg = "slate_700"

# Diff (terminal-pane variants — louder than line-bg diffs)
diff_term_plus      = "lime_400"
diff_term_minus     = "red_400"

# Word-level diff fills. These are BACKGROUNDS — Claude Code paints the
# changed word of a line with them and draws its own near-white syntax ink on
# top. `success`/`error` sat here before and gave 1.07:1.
diff_word_plus      = "green_800"
diff_word_minus     = "red_550"

# Editor chrome
line_number         = "gray_600"
line_number_active  = "gray_100"
line_number_hover   = "gray_300"
scrollbar_thumb     = "gray_400"
drop_target         = "gray_400"
search_highlight    = "cyan_400"
search_match_active = "orange_500"

# ANSI 16 + the dim (SGR 2) siblings. Every terminal target reads exactly
# these — bright is lighter than normal, dim is darker, per hue. Black is the
# one family where "normal" is already the floor, so dim goes to pure black.
#
# A program picks any slot as a foreground (SGR 30-37, 90-97) or as a
# background (SGR 40-47, 100-107) and the theme cannot tell which. On this bg
# no color clears 4.5:1 in both roles: a foreground needs luminance >= 0.234,
# a background needs <= 0.125. So the rows divide the work.
#
#   normal 1-6   luminance 0.205 — 4.04:1 as ink on bg, 3.08:1 under `text`
#                when a program fills with it. This is the row that stops the
#                bright-on-bright case, and it costs the vivid ayu hues: at
#                this level yellow is dark gold and green is olive.
#   bright 1-6   luminance 0.500 — 8.73:1 as ink, foreground-first. As a fill
#                it needs dark ink, which no palette can fix.
#   dim 1-6      luminance 0.090 — 2.22:1, which is what SGR 2 asks for.
#
# The three steps keep their source hue: each was re-targeted in Oklab at the
# most chroma sRGB holds at that luminance. tools/audit.py checks the ratios.
ansi_black          = "gray_950"
ansi_red            = "red_450"
ansi_green          = "green_750"
ansi_yellow         = "yellow_600"
ansi_blue           = "blue_550"
ansi_magenta        = "purple_550"
ansi_cyan           = "cyan_650"
ansi_white          = "gray_200"

ansi_bright_black   = "gray_600"
ansi_bright_red     = "red_250"
ansi_bright_green   = "green_400"
ansi_bright_yellow  = "yellow_450"
ansi_bright_blue    = "blue_300"
ansi_bright_magenta = "purple_350"
ansi_bright_cyan    = "cyan_525"
ansi_bright_white   = "white"

ansi_dim_black      = "black"
ansi_dim_red        = "red_600"
ansi_dim_green      = "green_950"
ansi_dim_yellow     = "yellow_800"
ansi_dim_blue       = "blue_675"
ansi_dim_magenta    = "purple_750"
ansi_dim_cyan       = "cyan_800"
ansi_dim_white      = "gray_400"

# Players (collab cursor bg)
player_bg           = "gray_500"

# Chat
chat_check          = "lime_400"
chat_msg_bg         = "gray_850"

# Syntax
syn_keyword         = "orange_400"
syn_function        = "yellow_400"
syn_string          = "lime_400"
syn_string_regex    = "teal_400"
syn_comment         = "gray_500"
syn_number          = "purple_400"
syn_type            = "cyan_400"
syn_operator        = "orange_400"
syn_attribute       = "cyan_400"
syn_punctuation     = "gray_300"
syn_doc             = "gray_400"
syn_string_special  = "yellow_300"
syn_predictive      = "blue_predict"
