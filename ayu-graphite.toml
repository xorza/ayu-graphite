# Ayu Graphite — semantic palette (single source of truth)
#
# Two-tier:
#   [primitives] are the actual hex values, named by hue and tint.
#   [semantic]   keys reference primitives by name; that's what builders read.
#
# palette.py resolves the refs at load time. To shift a hue everywhere it's
# used, edit one primitive — semantic intent stays put.
#
# THE GRID. Eight hues by four tints, complete. A hue is one fixed Oklab
# angle. A tint is one fixed PERCEIVED brightness that every hue shares, so
# `red_normal` and `cyan_normal` look equally bright and any two names ending
# in the same tint sit level with each other.
#
# Perceived, not measured. At one luminance a saturated color looks brighter
# than a dull one — the Helmholtz-Kohlrausch effect — so an equal-luminance
# row reads uneven: it put red at 65 and yellow at 55 on a scale where the
# whole row measured CIE L* 49.5. Each cell here is placed by Fairchild-
# Pirrotta corrected lightness L** instead, which folds chroma into the
# prediction. Luminance and chroma both vary along a row to hold L** level.
#
#   tint      L**    what lands there
#   vivid     87.4    success, warning, string, type, accent hover
#   bright    75.4    ANSI 9-14, accent, error, hint, keyword, number
#   normal    57.3    ANSI 1-6, status borders, diff word fills, pressed
#   dim       32.1    ANSI dim (SGR 2), status fills, selection
#
# Each cell is the most chroma sRGB holds at that hue while still landing on
# the row's L**, and each row's L** is the one that buys the most chroma
# across all eight hues at once. The luminance a cell ends up at is bounded by
# the audit rules:
#
#   vivid, bright   >= 0.40, so an INK role clears 4.5:1 on `surface` and
#                   4.5:1 over a selection on `dim`. The two rows are held 12
#                   points of L** apart so they read as two rows.
#   normal          the ANSI band, 0.139 to 0.212, tightened to <= 0.183 for
#                   red and green so near-white clears 4.5:1 on a diff word
#                   fill, and to >= 0.175 for cyan so `on_accent` clears the
#                   same on the pressed accent.
#   dim             <= 0.050 so `text_muted` clears 4.5:1 on a selection,
#                   >= 0.030 so the fill separates from the editor ground.
#
# Chroma still differs across a row, and now that is the point: cyan needs
# less of it than red to look equally bright.
#
# Twenty-four of the thirty-two cells carry a semantic role. The other eight
# stay defined: the grid is the artifact, and a hue keeps its four tints.
#
# Invariants (tools/audit.py checks all five):
#   - chrome layers that stack in one view must differ: bg < panel < elem <
#     elem_hover < elem_active, and border must be visible on panel and elem.
#   - every bright fill (accent, success, warning, error) is written on with
#     on_accent, never with text — text on accent is 1.28:1.
#   - per hue, ANSI dim < normal < bright, and no two of the 16 share a value.
#   - the ANSI rows split the two duties one slot cannot hold at once. See the
#     [semantic] ANSI block.
#   - every cell of a tint row looks equally bright, within 1.5 points of L**.
#     Nothing else defends that, so a hand-edit would break it silently.

[primitives]
# Neutrals, dark to light. Saturation zero — every channel equal, no hue at
# all — and named for their Oklab L. Seven is the floor, not a preference.
# Five go to chrome: bg, panel, surface, hover and press are checked against
# each other pairwise, so none may repeat, and they run evenly at 0.05, the
# widest step that still leaves `text` clearing 4.5:1 on the press fill. The
# other two are the whole text hierarchy, one dim and one bright, and the dim
# one sits at 0.72 because below that `text_muted` stops clearing 4.5:1 on a
# surface. A sixth grey has to come out of that pair, which leaves muted text
# and body text the same color.
black     = "#000000"
gray_24   = "#1e1e1e"
gray_29   = "#2a2a2a"
gray_34   = "#373737"
gray_39   = "#444444"
gray_44   = "#515151"
gray_72   = "#a4a4a4"
gray_94   = "#eaeaea"
white     = "#ffffff"

# Red — hue 31.6
red_vivid       = "#ffccc1"
red_bright      = "#fd8974"
red_normal      = "#c33b26"
red_dim         = "#621106"

# Orange — hue 66.0
orange_vivid    = "#fecfa1"
orange_bright   = "#f29407"
orange_normal   = "#ab6700"
orange_dim      = "#573306"

# Yellow — hue 91.0
yellow_vivid    = "#fecd12"
yellow_bright   = "#d0a70e"
yellow_normal   = "#94770b"
yellow_dim      = "#4e3d01"

# Green — hue 121.0
green_vivid     = "#b9dd0d"
green_bright    = "#98b614"
green_normal    = "#687e04"
green_dim       = "#344004"

# Teal — hue 169.7
teal_vivid      = "#03eab7"
teal_bright     = "#14c096"
teal_normal     = "#048567"
teal_dim        = "#074434"

# Cyan — hue 220.0
cyan_vivid      = "#87e2fe"
cyan_bright     = "#12b9df"
cyan_normal     = "#0b829d"
cyan_dim        = "#084250"

# Blue — hue 239.2
blue_vivid      = "#aadbfe"
blue_bright     = "#4db3f1"
blue_normal     = "#0179b1"
blue_dim        = "#013b58"

# Magenta — hue 312.0
magenta_vivid   = "#e9c6ff"
magenta_bright  = "#c698e2"
magenta_normal  = "#8758a3"
magenta_dim     = "#412452"

[semantic]

# Backgrounds / chrome. Each step must be distinguishable from the one under
# it — a control that shares its fill with the panel it sits on disappears.
bg                  = "gray_24"             # deepest: editor, list/view interiors
panel               = "gray_29"             # window, sidebar, menu, tab bar
surface             = "gray_34"             # elevated: popup, tooltip, dialog
elem                = "gray_34"             # control resting fill
elem_hover          = "gray_39"
elem_active         = "gray_44"
elem_disabled       = "gray_29"             # recessed below resting, not equal to it
title_bar           = "gray_34"
title_bar_inactive  = "gray_29"
overlay_black       = "black"

# Borders
border              = "gray_39"
border_focused      = "blue_normal"

# Text
text                = "gray_94"
text_muted          = "gray_72"
text_disabled       = "gray_72"

# Accent / status. Every one of these is an INK role, so all of them sit on
# `vivid` or `bright` — the two tints that clear 4.5:1 on `surface`.
accent              = "cyan_bright"
accent_hover        = "cyan_vivid"
accent_active       = "cyan_normal"
success             = "green_vivid"
warning             = "yellow_vivid"
error               = "red_bright"
hint                = "blue_bright"

# Ink for anything drawn on a bright fill — accent buttons, unread badges,
# success/warning/error chips. `text` on `accent` is 1.28:1.
on_accent           = "black"
on_accent_muted     = "cyan_dim"

# Selection (list row, selected message, selected text). On `dim`, the one
# tint dark enough for `accent` to stay legible on top of it.
selection_bg        = "blue_dim"
selection_fg        = "gray_94"

# Status fills take `dim`, their borders `normal`.
info_bg             = "blue_dim"
info_border         = "blue_normal"
hint_bg             = "blue_dim"
hint_border         = "blue_normal"
success_bg          = "green_dim"
success_border      = "green_normal"
warning_bg          = "yellow_dim"
warning_border      = "yellow_normal"
error_bg            = "red_dim"
error_border        = "red_normal"
diagnostic_muted_bg = "gray_44"

# Diff (terminal-pane variants — louder than line-bg diffs)
diff_term_plus      = "green_vivid"
diff_term_minus     = "red_bright"

# Word-level diff fills. These are BACKGROUNDS — Claude Code paints the
# changed word of a line with them and draws its own near-white syntax ink on
# top. `normal` is the darkest tint that ink still clears 4.5:1 on.
diff_word_plus      = "green_normal"
diff_word_minus     = "red_normal"

# Editor chrome
line_number         = "gray_44"
line_number_active  = "gray_94"
line_number_hover   = "gray_94"
scrollbar_thumb     = "gray_72"
drop_target         = "gray_72"
search_highlight    = "cyan_vivid"
search_match_active = "orange_bright"

# ANSI 16 + the dim (SGR 2) siblings. Every terminal target reads exactly
# these — bright is lighter than normal, dim is darker, per hue. Black is the
# one family where "normal" is already the floor, so dim goes to pure black.
#
# A program picks any slot as a foreground (SGR 30-37, 90-97) or as a
# background (SGR 40-47, 100-107) and the theme cannot tell which. On this bg
# no color clears 4.5:1 in both roles: a foreground needs luminance >= 0.234,
# a background needs <= 0.125. So the rows divide the work.
#
#   normal 1-6   3.62:1 as ink on bg, 3.45:1 under `text` when a program
#                fills with it. This is the row that stops the
#                bright-on-bright case, and it costs the vivid ayu hues: at
#                this luminance yellow is dark gold and green is olive.
#   bright 1-6   7.46:1 as ink, foreground-first. As a fill it needs dark
#                ink, which no palette can fix.
#   dim 1-6      1.58:1, which is what SGR 2 asks for. `dim` is pinned by the
#                selection rule, so faint here is the price of a selection
#                the accent stays legible on.
ansi_black          = "gray_24"
ansi_red            = "red_normal"
ansi_green          = "green_normal"
ansi_yellow         = "yellow_normal"
ansi_blue           = "blue_normal"
ansi_magenta        = "magenta_normal"
ansi_cyan           = "cyan_normal"
ansi_white          = "gray_94"

ansi_bright_black   = "gray_44"
ansi_bright_red     = "red_bright"
ansi_bright_green   = "green_bright"
ansi_bright_yellow  = "yellow_bright"
ansi_bright_blue    = "blue_bright"
ansi_bright_magenta = "magenta_bright"
ansi_bright_cyan    = "cyan_bright"
ansi_bright_white   = "white"

ansi_dim_black      = "black"
ansi_dim_red        = "red_dim"
ansi_dim_green      = "green_dim"
ansi_dim_yellow     = "yellow_dim"
ansi_dim_blue       = "blue_dim"
ansi_dim_magenta    = "magenta_dim"
ansi_dim_cyan       = "cyan_dim"
ansi_dim_white      = "gray_72"

# Players (collab cursor bg)
player_bg           = "gray_72"

# Chat
chat_check          = "green_vivid"
chat_msg_bg         = "gray_34"

# Syntax
syn_keyword         = "orange_bright"
syn_function        = "yellow_vivid"
syn_string          = "green_vivid"
syn_string_regex    = "teal_vivid"
syn_comment         = "gray_72"
syn_number          = "magenta_bright"
syn_type            = "cyan_vivid"
syn_operator        = "orange_bright"
syn_attribute       = "cyan_vivid"
syn_punctuation     = "gray_94"
syn_doc             = "gray_72"
syn_string_special  = "orange_vivid"
syn_predictive      = "blue_normal"
